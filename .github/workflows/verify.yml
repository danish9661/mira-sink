name: Verify cast + UIBC

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    name: Emulator loopback verification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug :testsource:assembleDebug --no-daemon

      - name: Boot emulator and run verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: test/run-test.sh 2 1280 720 30 10

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: test/last-run.log
          if-no-files-found: ignore
